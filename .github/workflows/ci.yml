name: CodeArena Production CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'auto/**'
  pull_request:
    branches:
      - main

jobs:
  backend-test:
    name: Backend Test & Typecheck
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client & sync db
        run: |
          npx prisma db push
          npx prisma generate
          npx tsx prisma/seed.ts

      - name: Typecheck backend TypeScript
        run: npx tsc --noEmit

      - name: Run Vitest test suite (Unit & Integration)
        run: npm test
        env:
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-key-at-least-32-chars-long
          REFRESH_TOKEN_SECRET: test-refresh-secret-key-at-least-32-chars

      - name: Build backend distribution
        run: npm run build

  frontend-test:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend Vite application
        run: npm run build

  docker-verification:
    name: Dockerfile Build Verification
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Backend Dockerfile builds
        run: docker build -t codearena-backend:test ./backend

      - name: Verify Frontend Dockerfile builds
        run: docker build -t codearena-frontend:test ./frontend

      - name: Verify Judge Dockerfile builds
        run: docker build -t codearena-judge:test ./judge
